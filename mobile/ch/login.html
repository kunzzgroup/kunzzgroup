<!DOCTYPE html>
<html lang="zh">

<head>
  <link rel="icon" type="image/png" href="../../../images/images/logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入 - KUNZZ HOLDINGS</title>

  <link rel="stylesheet" href="css/login.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- 字体 -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

  <section class="login-section">
    <div class="login-form">
      <h2>登入</h2>

      <!-- ✅ FORM -->
      <form id="loginForm" action="login.php" method="POST" autocomplete="on">

        <!-- 邮箱 -->
        <label class="input-label">账号</label>
        <input type="email" name="username" placeholder="请输入邮箱地址" required autocomplete="username">

        <!-- 密码 -->
        <label class="input-label">密码</label>
        <div class="password-container">
          <input type="password" id="password" name="password" placeholder="密码" required
            autocomplete="current-password">

          <img src="../images/icons/eye.svg" id="toggle-password" class="eye-icon">
        </div>

        <!-- 选项 -->
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember" name="remember" value="1">
            记住我
          </label>

          <div class="forgot-password">
            <a href="reset_password.html">忘记密码？</a>
          </div>
        </div>

        <!-- 登录按钮 -->
        <button type="submit" id="loginBtn">登入</button>

      </form>

      <hr class="form-divider">

      <!-- 错误提示（取代 alert） -->
      <div id="error-msg" style="color:red; text-align:center; margin-top:10px; display:none;"></div>

    </div>
  </section>

  <script src="../app.js?v=2"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const form = document.getElementById("loginForm");
      const btn = document.getElementById("loginBtn");
      const errorMsg = document.getElementById("error-msg");

      // ✅ redirect 自动带入
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect');
      if (redirect) {
        form.action = 'login.php?redirect=' + encodeURIComponent(redirect);
      }

      // ✅ 显示/隐藏密码
      const toggle = document.getElementById("toggle-password");
      const password = document.getElementById("password");

      toggle.addEventListener("click", function () {
        password.type = password.type === "password" ? "text" : "password";
      });

      // ✅ 防中文输入
      const emailInput = document.querySelector('input[name="username"]');

      [emailInput, password].forEach(input => {
        input.addEventListener("input", function () {
          this.value = this.value.replace(/[\u4e00-\u9fa5]/g, '');
        });
      });

      // ✅ 防重复提交（mobile 很重要）
      form.addEventListener("submit", function () {
        btn.disabled = true;
        btn.innerText = "登入中...";
      });

      // ✅ 如果已经登录（有cookie），自动跳过登录页
      if (document.cookie.includes("remember_token")) {
        console.log("检测到记住我，自动跳转...");
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect') || 'stocklistj1.php';
        window.location.href = 'login.php?redirect=' + encodeURIComponent(redirect);
      }

    });
  </script>

</body>

</html>
